name: Go
on: [push]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go 1.20
        uses: actions/setup-go@v5
        with:
          go-version: 1.20

      - name: Get dependencies
        run: go get -v -t -d ./...

      - name: Test
        run: go test ./...
